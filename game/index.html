<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Comet Dash</title>
<style>
  html, body { margin: 0; height: 100%; background: #05030f; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// Comet Dash: steer a comet through falling asteroids, grab stars for points,
// and hold on as everything speeds up every 10 seconds. One file, no libraries.
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');        // the autopilot plays
const CAPTURE = params.has('capture');  // time moves only when __advance() is called (for recording)
const seed = Number(params.get('seed')) || (Date.now() % 100000);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(seed);
const rnd = (a, b) => a + (b - a) * rand();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, S = 1; // canvas pixels, and S = 1 on a 540 x 960 screen
function resize() {
  const dpr = CAPTURE ? 1 : Math.min(2, window.devicePixelRatio || 1);
  W = cv.width = Math.round(innerWidth * dpr);
  H = cv.height = Math.round(innerHeight * dpr);
  S = Math.min(W / 540, H / 960);
  if (game) game.p.y = H * 0.8;
}

const BEST_KEY = 'comet-dash-best';
let best = 0;
try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { /* storage blocked */ }

const sky = Array.from({ length: 150 }, () => ({ x: rand(), y: rand(), z: rnd(0.15, 1) }));
const events = [];
let frame = 0, state = 'title', game = null;
const emit = (type) => events.push({ frame, type });

function newGame() {
  game = {
    t: 0, score: 0, stars: 0, level: 0, banner: 0, shake: 0, alive: true, deadT: 0, aiX: W / 2,
    p: { x: W / 2, y: H * 0.8, vx: 0, trail: [] },
    rocks: [], gems: [], parts: [], rockTimer: 0.8, gemTimer: 1.0,
  };
  state = 'play';
}
resize();
addEventListener('resize', resize);

// ---- input: arrow keys / A-D, or touch and drag anywhere ----
const keys = { left: false, right: false };
const pointer = { active: false, x: 0 };
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); startOrRestart(); }
});
addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});
const toCanvasX = (e) => e.clientX * (W / innerWidth);
cv.addEventListener('pointerdown', (e) => { pointer.active = true; pointer.x = toCanvasX(e); startOrRestart(); });
cv.addEventListener('pointermove', (e) => { if (pointer.active) pointer.x = toCanvasX(e); });
addEventListener('pointerup', () => { pointer.active = false; });
function startOrRestart() {
  if (state === 'title' || (game && !game.alive && game.deadT > 0.6)) newGame();
}

// ---- the autopilot (demo mode): pick the safest lane, lean toward stars ----
function autopilot() {
  const g = game, p = g.p, lanes = 31, maxV = 950 * S;
  let bestX = p.x, bestV = -Infinity;
  for (let i = 0; i < lanes; i++) {
    const x = (i + 0.5) / lanes * W;
    let v = -Math.abs(x - p.x) / W * 0.8 + (Math.abs(x - g.aiX) < W / lanes ? 0.25 : 0);
    const reach = Math.abs(x - p.x) / maxV;
    for (const r of g.rocks) {
      const dy = p.y - r.y;
      if (dy < -r.r * 1.2 || dy > H * 0.6) continue;
      const tHit = Math.max(0, dy) / r.vy;
      const clear = r.r + 46 * S;
      const dx = Math.abs(r.x - x);
      if (dx < clear) v -= 7 * (1 - dx / clear) / (0.2 + tHit);
      const lo = Math.min(p.x, x) - clear, hi = Math.max(p.x, x) + clear;
      if (tHit < reach + 0.15 && r.x > lo && r.x < hi) v -= 3 / (0.2 + tHit);
    }
    for (const s of g.gems) {
      const dy = p.y - s.y;
      if (dy < 0 || dy > H * 0.65) continue;
      const dx = Math.abs(s.x - x);
      if (dx < 70 * S) v += 1.4 * (1 - dx / (70 * S));
    }
    if (x < 40 * S || x > W - 40 * S) v -= 1.5;
    if (v > bestV) { bestV = v; bestX = x; }
  }
  g.aiX = bestX;
  return bestX;
}

function burst(x, y, n, hue, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand() * Math.PI * 2, s = rnd(0.2, 1) * speed * S;
    game.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.4, 0.9), max: 0.9, hue, size: rnd(2, 5) * S });
  }
}

function spawnRock(mult) {
  const r = rnd(22, 50) * S, n = 9, verts = [];
  for (let i = 0; i < n; i++) verts.push(rnd(0.72, 1.06));
  game.rocks.push({ x: rnd(r, W - r), y: -r, r, vy: rnd(250, 380) * S * mult, rot: rnd(0, 6.3), vr: rnd(-2, 2), verts });
}

function step(dt) {
  frame++;
  const mult = game ? 1 + 0.3 * game.level : 1;
  for (const s of sky) { s.y += dt * (0.04 + s.z * 0.22) * mult; if (s.y > 1) { s.y -= 1; s.x = rand(); } }
  if (state !== 'play') return;
  const g = game, p = g.p;
  for (const q of g.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.97; q.vy *= 0.97; q.life -= dt; }
  g.parts = g.parts.filter((q) => q.life > 0);
  g.shake = Math.max(0, g.shake - dt * 2.5);
  if (!g.alive) {
    g.deadT += dt;
    if (DEMO && g.deadT > 2.5) newGame();
    return;
  }

  g.t += dt;
  const lvl = Math.floor(g.t / 10);
  if (lvl > g.level) { g.level = lvl; g.banner = 1.6; emit('speedup'); }
  g.banner = Math.max(0, g.banner - dt);

  const maxV = 950 * S;
  let target = null;
  if (DEMO) target = autopilot(); else if (pointer.active) target = pointer.x;
  if (target !== null) p.vx = clamp((target - p.x) * 9, -maxV, maxV);
  else { const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0); p.vx += (dir * maxV - p.vx) * Math.min(1, dt * 10); }
  p.x = clamp(p.x + p.vx * dt, 18 * S, W - 18 * S);
  for (const t of p.trail) t.y += 520 * S * mult * dt;
  p.trail.push({ x: p.x, y: p.y });
  if (p.trail.length > 28) p.trail.shift();

  g.rockTimer -= dt; g.gemTimer -= dt;
  if (g.rockTimer <= 0) { spawnRock(mult); g.rockTimer = rnd(0.32, 0.62) / mult; }
  if (g.gemTimer <= 0) { g.gems.push({ x: rnd(36 * S, W - 36 * S), y: -30 * S, vy: 230 * S * mult, spin: rnd(0, 6.3) }); g.gemTimer = rnd(0.8, 1.5); }

  for (const r of g.rocks) {
    r.y += r.vy * dt; r.rot += r.vr * dt;
    if (Math.hypot(r.x - p.x, r.y - p.y) < r.r * 0.82 + 13 * S) {
      g.alive = false; g.shake = 1; burst(p.x, p.y, 70, 190, 520); burst(p.x, p.y, 30, 320, 380); emit('crash');
      if (g.score > best) { best = g.score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* ignore */ } }
    }
  }
  for (const s of g.gems) {
    s.y += s.vy * dt; s.spin += dt * 3;
    if (!s.taken && Math.hypot(s.x - p.x, s.y - p.y) < 36 * S) { s.taken = true; g.stars++; burst(s.x, s.y, 24, 48, 300); emit('star'); }
  }
  g.rocks = g.rocks.filter((r) => r.y < H + r.r * 2);
  g.gems = g.gems.filter((s) => !s.taken && s.y < H + 40 * S);
  g.score = Math.floor(g.t * 10) + g.stars * 50;
}

// ---- drawing ----
function starPath(x, y, r, spin) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = spin + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

function render() {
  const g = game, mult = g ? 1 + 0.3 * g.level : 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#080420'); bg.addColorStop(1, '#1c0832');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (g && g.shake > 0) ctx.translate(rnd(-1, 1) * g.shake * 14 * S, rnd(-1, 1) * g.shake * 14 * S);

  for (const s of sky) {
    ctx.fillStyle = `rgba(200,220,255,${0.25 + s.z * 0.6})`;
    const len = (2 + s.z * 10 * mult) * S;
    ctx.fillRect(s.x * W, s.y * H, Math.max(1, s.z * 2.4 * S), len);
  }

  if (g) {
    ctx.save();
    ctx.shadowBlur = 22 * S;
    for (const s of g.gems) {
      ctx.shadowColor = '#ffb300'; ctx.fillStyle = '#ffe25c';
      starPath(s.x, s.y, 20 * S * (1 + 0.12 * Math.sin(s.spin * 2)), s.spin);
      ctx.fill();
    }
    for (const r of g.rocks) {
      ctx.shadowColor = '#ff2fa0'; ctx.strokeStyle = '#ff4fb0'; ctx.fillStyle = '#1d0b33'; ctx.lineWidth = 3.5 * S;
      ctx.beginPath();
      r.verts.forEach((k, i) => {
        const a = r.rot + i / r.verts.length * Math.PI * 2;
        ctx.lineTo(r.x + Math.cos(a) * r.r * k, r.y + Math.sin(a) * r.r * k);
      });
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const p = g.p;
    if (g.alive) {
      p.trail.forEach((t, i) => {
        const k = i / p.trail.length;
        ctx.fillStyle = `hsla(${190 + (1 - k) * 80}, 100%, 60%, ${k * 0.35})`;
        ctx.beginPath(); ctx.arc(t.x, t.y, (4 + k * 16) * S, 0, Math.PI * 2); ctx.fill();
      });
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 46 * S);
      glow.addColorStop(0, 'rgba(255,255,255,1)'); glow.addColorStop(0.25, 'rgba(90,230,255,0.9)'); glow.addColorStop(1, 'rgba(40,120,255,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(p.x, p.y, 46 * S, 0, Math.PI * 2); ctx.fill();
    }
    for (const q of g.parts) {
      ctx.fillStyle = `hsla(${q.hue}, 100%, 65%, ${q.life / q.max})`;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const font = (px, w = 800) => `${w} ${px * S}px "Segoe UI", system-ui, sans-serif`;
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 16 * S; ctx.fillStyle = '#fff';
  if (state === 'title') {
    ctx.font = font(64, 900); ctx.fillText('COMET DASH', W / 2, H * 0.38);
    ctx.shadowBlur = 0; ctx.font = font(22, 600); ctx.fillStyle = '#b9c6ff';
    ctx.fillText('← → or drag to steer · grab the stars', W / 2, H * 0.47);
    ctx.fillText('tap or press Space to start', W / 2, H * 0.52);
    if (best) ctx.fillText('best ' + best, W / 2, H * 0.58);
    return;
  }
  ctx.textAlign = 'right';
  ctx.font = font(46, 900); ctx.fillText(String(g.score), W - 28 * S, 92 * S);
  ctx.shadowBlur = 0; ctx.font = font(18, 700); ctx.fillStyle = '#ffe25c';
  ctx.fillText(`★ ${g.stars}   SPEED ×${mult.toFixed(1)}`, W - 28 * S, 132 * S);
  ctx.textAlign = 'center';
  if (g.banner > 0) {
    const k = g.banner / 1.6, sc = 1 + (1 - k) * 0.25;
    ctx.globalAlpha = Math.min(1, k * 2); ctx.fillStyle = '#ffe25c'; ctx.shadowColor = '#ff2fa0'; ctx.shadowBlur = 24 * S;
    ctx.font = font(60 * sc, 900); ctx.fillText('SPEED UP!', W / 2, H * 0.42);
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  if (!g.alive && g.deadT > 0.5) {
    ctx.fillStyle = 'rgba(5,3,15,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#ff2fa0'; ctx.shadowBlur = 20 * S;
    ctx.font = font(60, 900); ctx.fillText('GAME OVER', W / 2, H * 0.4);
    ctx.shadowBlur = 0; ctx.font = font(26, 700); ctx.fillText(`score ${g.score} · best ${best}`, W / 2, H * 0.47);
    ctx.font = font(20, 600); ctx.fillStyle = '#b9c6ff'; ctx.fillText('tap or press Space to fly again', W / 2, H * 0.52);
  }
  if (DEMO) {
    ctx.font = font(16, 700); ctx.fillStyle = 'rgba(185,198,255,0.75)';
    ctx.fillText('DEMO · AUTOPILOT', W / 2, H - 40 * S);
  }
}

// ---- the loop: a fixed 60 Hz step, or stepped by hand when recording ----
const DT = 1 / 60;
if (CAPTURE) {
  newGame();
  window.__advance = (n, draw = true) => { for (let i = 0; i < n; i++) step(DT); if (draw) render(); };
  window.__info = () => ({ seed, frame, alive: game.alive, t: game.t, score: game.score, stars: game.stars });
  window.__events = events;
  render();
} else {
  if (DEMO) newGame();
  let last = performance.now(), acc = 0;
  const loop = (now) => {
    acc = Math.min(acc + (now - last) / 1000, 0.25); last = now;
    while (acc >= DT) { step(DT); acc -= DT; }
    render();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
