<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comet Dash: the making-of scenes</title>
<style>html, body { margin: 0; background: #0b0820; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// The two "making of" beats of the video, drawn on a 1080 x 1920 canvas and stepped frame by frame:
//   0.0 - 4.5 s  THE PROMPT: the one prompt types itself into a terminal
//   4.5 - 12.5 s THE AGENT, WORKING: the game's real source streams into an editor, sped up
// capture.mjs hands in the prompt and the source with __setText() and records each frame.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1080, H = 1920, DT = 1 / 60;
const MONO = '"Cascadia Mono", Consolas, monospace';
const SANS = '"Segoe UI", system-ui, sans-serif';
let t = 0, prompt = '', lines = [];
const events = [];
const PROMPT_END = 4.5, CODE_END = 12.5;

window.__setText = (p, src) => { prompt = p; lines = src.replace(/\r/g, '').split('\n'); draw(); };
window.__events = events;
window.__advance = (n, render = true) => {
  for (let i = 0; i < n; i++) {
    const before = typedChars();
    t += DT;
    if (typedChars() > before && t < PROMPT_END) events.push({ t, type: 'key' });
  }
  if (render) draw();
};

const typeStart = 0.35, cps = 52;
const typedChars = () => Math.max(0, Math.min(prompt.length, Math.floor((t - typeStart) * cps)));

function wrap(text, maxW) {
  const out = []; let line = '';
  for (const word of text.split(' ')) {
    const tryLine = line ? line + ' ' + word : word;
    if (ctx.measureText(tryLine).width > maxW && line) { out.push(line); line = word; } else line = tryLine;
  }
  if (line) out.push(line);
  return out;
}

function headline(text, sub, y, k) {
  ctx.save();
  ctx.globalAlpha = k;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = `900 86px ${SANS}`; ctx.fillStyle = '#ffe25c'; ctx.shadowColor = '#ff2fa0'; ctx.shadowBlur = 30;
  ctx.fillText(text, W / 2, y);
  if (sub) { ctx.shadowBlur = 0; ctx.font = `600 38px ${SANS}`; ctx.fillStyle = '#c9d2ff'; ctx.fillText(sub, W / 2, y + 62); }
  ctx.restore();
}

function windowFrame(x, y, w, h, title) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,229,255,0.35)'; ctx.shadowBlur = 40;
  ctx.fillStyle = '#120d2a'; roundRect(x, y, w, h, 28); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#3b2f78'; ctx.lineWidth = 3; roundRect(x, y, w, h, 28); ctx.stroke();
  ctx.fillStyle = '#1c1540'; roundRect(x, y, w, 70, 28); ctx.fill(); ctx.fillRect(x, y + 40, w, 30);
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 44 + i * 40, y + 35, 12, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#9aa3d9'; ctx.font = `600 28px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(title, x + w / 2, y + 36);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function background() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0620'); g.addColorStop(1, '#1d0834');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(120,90,255,0.08)'; ctx.lineWidth = 2;
  const off = (t * 60) % 80;
  for (let y = -80 + off; y < H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let x = 0; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
}

function drawPrompt() {
  const k = Math.min(1, t / 0.3);
  headline('THE PROMPT', 'one sentence, typed once', 560, k);
  const x = 70, y = 700, w = 940, h = 640;
  windowFrame(x, y, w, h, 'claude — one-prompt-comet');
  ctx.save();
  ctx.font = `600 46px ${MONO}`; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  const shown = prompt.slice(0, typedChars());
  const rows = wrap('> ' + shown, w - 100);
  rows.forEach((row, i) => { ctx.fillStyle = i === 0 ? '#ffffff' : '#ffffff'; ctx.fillText(row, x + 50, y + 110 + i * 64); });
  const done = typedChars() >= prompt.length;
  const last = rows[rows.length - 1] || '';
  const cx = x + 50 + ctx.measureText(last).width + 6, cy = y + 110 + (rows.length - 1) * 64;
  if (!done || Math.floor(t * 3) % 2 === 0) { ctx.fillStyle = '#00e5ff'; ctx.fillRect(cx, cy + 2, 24, 50); }
  if (done) {
    const since = t - (typeStart + prompt.length / cps);
    ctx.font = `600 38px ${MONO}`; ctx.fillStyle = '#ffe25c';
    const spin = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'[Math.floor(t * 12) % 10];
    if (since > 0.15) ctx.fillText(`${spin} agent is building…`, x + 50, y + h - 100);
  }
  ctx.restore();
}

const KW = /^(const|let|function|return|if|else|for|of|new|true|false|null|while|try|catch|typeof)$/;
function drawCodeLine(text, x, y) {
  const re = /(\/\/.*$)|('[^']*'|"[^"]*"|`[^`]*`)|(<\/?[a-zA-Z][^>]*>)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)|(\s+)|(.)/g;
  let m, cx = x;
  while ((m = re.exec(text))) {
    const tok = m[0];
    let c = '#d6dcff';
    if (m[1]) c = '#6f7aa8'; else if (m[2]) c = '#ffe25c'; else if (m[3]) c = '#5fe3ff';
    else if (m[4]) c = '#ff9e64'; else if (m[5] && KW.test(tok)) c = '#ff5fb7';
    ctx.fillStyle = c; ctx.fillText(tok, cx, y);
    cx += ctx.measureText(tok).width;
    if (cx > x + 880) break;
  }
}

function drawCode() {
  const local = t - PROMPT_END, dur = CODE_END - PROMPT_END - 1.2;
  const k = Math.min(1, local / 0.3);
  headline('THE AGENT, WORKING', 'writing the whole game · sped up', 470, k);
  const x = 40, y = 600, w = 1000, h = 1020;
  windowFrame(x, y, w, h, 'game/index.html');
  const total = lines.reduce((n, l) => n + l.length + 1, 0);
  const p = Math.min(1, Math.max(0, local / dur));
  const eased = p < 1 ? 1 - Math.pow(1 - p, 1.6) : 1;
  let budget = Math.floor(total * eased), shownLines = 0, partial = '';
  for (const l of lines) {
    if (budget > l.length) { budget -= l.length + 1; shownLines++; } else { partial = l.slice(0, budget); break; }
  }
  const LH = 29, visible = Math.floor((h - 110) / LH);
  const cursorLine = Math.min(shownLines, lines.length - 1);
  const first = Math.max(0, cursorLine - visible + 3);
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y + 75, w, h - 80); ctx.clip();
  ctx.font = `500 24px ${MONO}`; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  for (let i = first; i <= cursorLine && i < first + visible; i++) {
    const ly = y + 95 + (i - first) * LH;
    ctx.fillStyle = '#4b4f7a'; ctx.textAlign = 'right'; ctx.fillText(String(i + 1), x + 74, ly); ctx.textAlign = 'left';
    const text = i < shownLines ? lines[i] : partial;
    drawCodeLine(text, x + 96, ly);
    if (i === cursorLine && p < 1) {
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(x + 96 + ctx.measureText(text).width + 2, ly, 13, 26);
    }
  }
  ctx.restore();
  // the status strip under the editor
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (p < 1) {
    ctx.font = `700 40px ${SANS}`; ctx.fillStyle = '#c9d2ff';
    ctx.fillText(`✎ writing game/index.html · line ${cursorLine + 1}`, W / 2, y + h + 70);
  } else {
    const pop = Math.min(1, (local - dur) / 0.25);
    ctx.globalAlpha = pop; ctx.font = `800 48px ${SANS}`; ctx.fillStyle = '#4dffa6'; ctx.shadowColor = '#4dffa6'; ctx.shadowBlur = 20;
    ctx.fillText(`✓ 1 file · ${lines.length} lines · 0 libraries`, W / 2, y + h + 70);
  }
  ctx.restore();
}

function draw() {
  background();
  if (t < PROMPT_END) drawPrompt(); else drawCode();
}
draw();
</script>
</body>
</html>
